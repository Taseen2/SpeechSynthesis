<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Voiceinator 5000</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="theme-switch-wrapper">
    <label class="theme-switch" for="checkbox">
      <input type="checkbox" id="checkbox" />
      <div class="slider"></div>
    </label>
    <em style="margin-left: 10px; font-size: 0.8rem; font-style: normal;">Dark Mode</em>
  </div>
  <main class="voiceinator">
    <h1>The Voiceinator 5000</h1>
    
    <div class="controls">
      <label for="voices">Select Voice:</label>
      <select name="voice" id="voices">
        <option value="">Select a voice...</option>
      </select>

      <div class="slider-group">
        <label for="rate">Rate:</label>
        <input name="rate" type="range" min="0" max="3" value="1" step="0.1" id="rate">
      </div>

      <div class="slider-group">
        <label for="pitch">Pitch:</label>
        <input name="pitch" type="range" min="0" max="2" value="1" step="0.1" id="pitch">
      </div>
    </div>

    <textarea name="text" id="text" rows="5">Hello! I am the Voiceinator 5000. How do I sound?</textarea>

    <div class="actions">
      <button id="stop" class="btn btn-stop">Stop</button>
      <button id="speak" class="btn btn-speak">Speak</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
